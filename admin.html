<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Dashboard</title>

<script src="https://cdn.tailwindcss.com"></script>

</head>

<body class="bg-gray-100 p-4">

<div class="max-w-7xl mx-auto">

    <!-- HEADER -->
    <div class="mb-6">
        <h1 class="text-2xl font-bold">Admin Dashboard</h1>
        <p class="text-gray-500">Manage registrations & payments</p>
    </div>

    <!-- ANALYTICS -->
    <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6">

        <div class="bg-white p-4 rounded shadow">
            <p class="text-sm text-gray-500">Total Users</p>
            <h2 id="totalUsers" class="text-xl font-bold">0</h2>
        </div>

        <div class="bg-green-100 p-4 rounded shadow">
            <p class="text-sm">Paid</p>
            <h2 id="paidUsers" class="text-xl font-bold">0</h2>
        </div>

        <div class="bg-yellow-100 p-4 rounded shadow">
            <p class="text-sm">Pending</p>
            <h2 id="pendingUsers" class="text-xl font-bold">0</h2>
        </div>

        <div class="bg-blue-100 p-4 rounded shadow">
            <p class="text-sm">Revenue</p>
            <h2 id="revenue" class="text-xl font-bold">₦0</h2>
        </div>

    </div>

    <!-- CONTROLS -->
    <div class="flex flex-col md:flex-row justify-between gap-3 mb-4">

        <input type="text" id="searchInput" placeholder="Search by email or name..."
            class="p-2 border rounded w-full md:w-1/3">

        <select id="filterStatus" class="p-2 border rounded">
            <option value="">All</option>
            <option value="paid">Paid</option>
            <option value="pending">Pending</option>
        </select>

        <button onclick="exportToExcel()"
            class="bg-green-500 text-white px-4 py-2 rounded">
            Export Excel
        </button>

    </div>

    <!-- TABLE -->
    <div class="overflow-x-auto bg-white rounded shadow">

        <table class="w-full text-sm">
            <thead class="bg-gray-200">
                <tr>
                    <th class="p-3 text-left">Name</th>
                    <th>Email</th>
                    <th>Phone</th>
                    <th>Method</th>
                    <th>Status</th>
                    <th>Action</th>
                </tr>
            </thead>

            <tbody id="userTable"></tbody>
        </table>

    </div>

</div>

<script>

const API = "https://vx33eu1m54wsq5jmeedimetm.199.192.25.147.sslip.io/admin/users";
const APPROVE_API = "https://vx33eu1m54wsq5jmeedimetm.199.192.25.147.sslip.io/admin/approve-payment";
const ADMIN_KEY = "mysecret123"; // same as backend


// ✅ CHECK AUTH FIRST
const token = localStorage.getItem("adminToken");

if (!token) {
    window.location.href = "adminLogin.html";
}

let usersData = [];

// FETCH USERS
async function fetchUsers() {
    const token = localStorage.getItem("adminToken");

    const res = await fetch(API, {
        headers: {
            "Authorization": token
        }
    });

    const data = await res.json();

    // ✅ HANDLE ERROR RESPONSE
    if (!res.ok) {
        document.getElementById("message").innerText = data.message || "Unauthorized";

        // Optional: redirect to login
        window.location.href = "admin-login.html";
        return;
    }

    // ✅ SAFE CHECK
    if (!Array.isArray(data)) {
        console.error("Invalid data:", data);
        return;
    }

    usersData = data;
    renderTable(data);
    updateStats(data);
}

// ================= RENDER TABLE =================
function renderTable(data) {
    const table = document.getElementById("userTable");
    table.innerHTML = "";

    if (data.length === 0) {
        table.innerHTML = `
            <tr>
                <td colspan="6" class="text-center p-4">No users found</td>
            </tr>
        `;
        return;
    }

    data.forEach(user => {
        const row = `
        <tr class="border-t">
            <td class="p-3">${user.name || "-"}</td>
            <td>${user.email || "-"}</td>
            <td>${user.tel || "-"}</td>
            <td>${user.paymentMethod || "-"}</td>
            <td>
                <span class="${
                    user.paymentStatus === 'paid'
                    ? 'text-green-600 font-semibold'
                    : 'text-yellow-600 font-semibold'
                }">
                    ${user.paymentStatus || "pending"}
                </span>
            </td>
            <td>
                ${
                    user.paymentStatus === "pending"
                    ? `<button onclick="approve('${user.email}')" 
                        class="bg-blue-500 hover:bg-blue-600 text-white px-3 py-1 rounded">
                        Approve
                       </button>`
                    : "✔"
                }
            </td>
        </tr>
        `;
        table.innerHTML += row;
    });
}

// ================= APPROVE PAYMENT =================
async function approve(email) {
    if (!confirm("Approve this payment?")) return;

    try {
        const res = await fetch(APPROVE_API, {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                "Authorization": "Bearer " + token
            },
            body: JSON.stringify({ email })
        });

        const data = await res.json();

        if (!res.ok) {
            showMessage(data.message || "Failed to approve");
            return;
        }

        showMessage("Payment approved ✅", "green");

        fetchUsers(); // refresh table

    } catch (err) {
        console.error(err);
        showMessage("Network error");
    }
}

// ================= ANALYTICS =================
function updateStats(data) {
    const total = data.length;
    const paid = data.filter(u => u.paymentStatus === "paid").length;
    const pending = data.filter(u => u.paymentStatus === "pending").length;

    const revenue = paid * 50000;

    document.getElementById("totalUsers").innerText = total;
    document.getElementById("paidUsers").innerText = paid;
    document.getElementById("pendingUsers").innerText = pending;
    document.getElementById("revenue").innerText = `₦${revenue.toLocaleString()}`;
}

// ================= SEARCH =================
document.getElementById("searchInput").addEventListener("input", (e) => {
    const value = e.target.value.toLowerCase();

    const filtered = usersData.filter(u =>
        (u.name || "").toLowerCase().includes(value) ||
        (u.email || "").toLowerCase().includes(value)
    );

    renderTable(filtered);
});

// ================= FILTER =================
document.getElementById("filterStatus").addEventListener("change", (e) => {
    const value = e.target.value;

    if (!value) return renderTable(usersData);

    const filtered = usersData.filter(u => u.paymentStatus === value);
    renderTable(filtered);
});

// ================= EXPORT =================
function exportToExcel() {
    let csv = "Name,Email,Phone,Method,Status\n";

    usersData.forEach(u => {
        csv += `${u.name},${u.email},${u.tel},${u.paymentMethod},${u.paymentStatus}\n`;
    });

    const blob = new Blob([csv], { type: "text/csv" });
    const url = window.URL.createObjectURL(blob);

    const a = document.createElement("a");
    a.href = url;
    a.download = "users.csv";
    a.click();
}

// ================= MESSAGE =================
function showMessage(msg, color = "red") {
    const el = document.getElementById("message");
    if (!el) return;

    el.className = `text-${color}-500 text-center mt-4`;
    el.innerText = msg;
}

// ================= INIT =================
fetchUsers();

</script>

</body>
</html>
