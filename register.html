<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register - Bamilk Lens</title>

<script src="https://cdn.tailwindcss.com"></script>

<style>
    body {
        font-family: 'Inter', sans-serif;
    }

    .bg-image {
        background: url('https://res.cloudinary.com/dlvurzdlr/image/upload/v1775438265/Bamilk_content_creation_conference_-50D1P_4365_filtered_w3lejb.jpg') no-repeat center center/cover;
        position: fixed;
        width: 100%;
        height: 100%;
        z-index: -2;
    }

    .overlay {
        position: fixed;
        width: 100%;
        height: 100%;
        background: rgba(10, 20, 40, 0.75);
        z-index: -1;
    }

    .loader {
        border: 3px solid rgba(255,255,255,0.3);
        border-top: 3px solid white;
        border-radius: 50%;
        width: 18px;
        height: 18px;
        animation: spin 1s linear infinite;
        display: none;
        margin-left: 10px;
    }

    @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
    }
</style>
</head>

<body class="flex items-center justify-center min-h-screen px-4">

<div class="bg-image"></div>
<div class="overlay"></div>

<!-- CARD -->
<div class="w-full max-w-md backdrop-blur-xl bg-white/10 border border-white/20 p-6 rounded-2xl shadow-2xl text-white">

    <!-- HEADER -->
    <div class="text-center mb-6">
        <h1 class="text-2xl font-bold">Bamilk Lens</h1>
        <p class="text-sm text-gray-300">Content Creation Conference</p>
        <p class="mt-2 text-lg font-semibold">Register Now</p>
    </div>

    <!-- FORM -->
    <form id="registerForm" class="space-y-4">

        <!-- NAME -->
        <div class="relative">
            <input type="text" id="name" placeholder="Full Name" required
                class="w-full p-3 pl-10 rounded-lg bg-white/20 border border-white/30 placeholder-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-400">
            <span class="absolute left-3 top-3 text-gray-300">👤</span>
        </div>

        <!-- EMAIL -->
        <div class="relative">
            <input type="email" id="email" placeholder="Email Address" required
                class="w-full p-3 pl-10 rounded-lg bg-white/20 border border-white/30 placeholder-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-400">
            <span class="absolute left-3 top-3 text-gray-300">📧</span>
        </div>

        <!-- PHONE -->
        <div class="relative">
            <input type="tel" id="tel" placeholder="Phone Number" required
                class="w-full p-3 pl-10 rounded-lg bg-white/20 border border-white/30 placeholder-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-400">
            <span class="absolute left-3 top-3 text-gray-300">📱</span>
        </div>

        <!-- BUTTON -->
        <button type="submit" id="submitBtn"
            class="w-full flex items-center justify-center bg-blue-500 hover:bg-blue-600 transition p-3 rounded-lg font-semibold shadow-lg">
            <span>Continue</span>
            <div class="loader" id="loader"></div>
        </button>

    </form>

    <!-- MESSAGE -->
    <p id="message" class="text-center text-red-400 mt-4 text-sm"></p>

    <!-- FOOTER -->
    <p class="text-center text-xs text-gray-300 mt-6">
        Secure registration • Limited slots available
    </p>

</div>

<script>
document.getElementById("registerForm").addEventListener("submit", async (e) => {
    e.preventDefault();

    const name = document.getElementById("name").value;
    const email = document.getElementById("email").value;
    const tel = document.getElementById("tel").value;

    const submitBtn = document.getElementById("submitBtn");
    const loader = document.getElementById("loader");
    const message = document.getElementById("message");

    submitBtn.disabled = true;
    loader.style.display = "inline-block";
    message.innerText = "";

    try {
        const response = await fetch("https://vx33eu1m54wsq5jmeedimetm.199.192.25.147.sslip.io/register/initiate", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ name, email, tel })
        });

        const data = await response.json();

        if (response.ok) {
            localStorage.setItem("email", email);
            window.location.href = "verify-otp.html";
        } else {
            message.innerText = data.message;
        }

    } catch (error) {
        message.innerText = "Network error. Please try again.";
        console.error(error);
    }

    submitBtn.disabled = false;
    loader.style.display = "none";
});
</script>

</body>
</html>
