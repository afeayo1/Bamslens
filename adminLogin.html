<!DOCTYPE html>
<html>
<head>
<title>Admin Login</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="flex items-center justify-center min-h-screen bg-gray-900">

<div class="bg-white p-6 rounded shadow w-full max-w-sm">

    <h2 class="text-xl font-bold text-center mb-4">Admin Login</h2>

    <form id="loginForm" class="space-y-3">
        <input type="email" id="email" placeholder="Email"
            class="w-full p-2 border rounded">

        <input type="password" id="password" placeholder="Password"
            class="w-full p-2 border rounded">

        <button class="w-full bg-blue-500 text-white p-2 rounded">
            Login
        </button>
    </form>

    <p id="msg" class="text-red-500 text-sm mt-2 text-center"></p>

</div>

<script>
document.getElementById("loginForm").addEventListener("submit", async (e) => {
    e.preventDefault();

    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;

    const res = await fetch("https://vx33eu1m54wsq5jmeedimetm.199.192.25.147.sslip.io/admin/login", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({ email, password })
    });

    const data = await res.json();

    if (res.ok) {
        localStorage.setItem("adminToken", data.token);
        window.location.href = "admin.html";
    } else {
        document.getElementById("msg").innerText = data.message;
    }
});
</script>

</body>
</html>
