<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verify Email - Bamilk Lens</title>

<script src="https://cdn.tailwindcss.com"></script>

<style>
    body {
        font-family: 'Inter', sans-serif;
    }

    .bg-image {
        background: url('/images/070c8525-78ba-4c3e-8618-6ff7f7d86240.jpg') no-repeat center center/cover;
        position: fixed;
        width: 100%;
        height: 100%;
        z-index: -2;
    }

    .overlay {
        position: fixed;
        width: 100%;
        height: 100%;
        background: rgba(10, 20, 40, 0.75);
        z-index: -1;
    }

    .loader {
        border: 3px solid rgba(255,255,255,0.3);
        border-top: 3px solid white;
        border-radius: 50%;
        width: 18px;
        height: 18px;
        animation: spin 1s linear infinite;
        display: none;
        margin-left: 10px;
    }

    @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
    }
</style>
</head>

<body class="flex items-center justify-center min-h-screen px-4">

<div class="bg-image"></div>
<div class="overlay"></div>

<!-- CARD -->
<div class="w-full max-w-md backdrop-blur-xl bg-white/10 border border-white/20 p-6 rounded-2xl shadow-2xl text-white">

    <!-- HEADER -->
    <div class="text-center mb-6">
        <h1 class="text-2xl font-bold">Verify Email</h1>
        <p class="text-sm text-gray-300 mt-2">Enter the 6-digit code sent to your email</p>
    </div>

    <!-- OTP INPUTS -->
    <form id="verifyForm" class="space-y-5">

        <div class="flex justify-between gap-2">
            <input type="text" maxlength="1" class="otp-box" />
            <input type="text" maxlength="1" class="otp-box" />
            <input type="text" maxlength="1" class="otp-box" />
            <input type="text" maxlength="1" class="otp-box" />
            <input type="text" maxlength="1" class="otp-box" />
            <input type="text" maxlength="1" class="otp-box" />
        </div>

        <!-- BUTTON -->
        <button type="submit" id="verifyBtn"
            class="w-full flex items-center justify-center bg-green-500 hover:bg-green-600 transition p-3 rounded-lg font-semibold shadow-lg">
            <span>Verify & Continue</span>
            <div class="loader" id="loader"></div>
        </button>

    </form>

    <!-- RESEND -->
    <div class="text-center mt-4 text-sm text-gray-300">
        Didn’t get code?
        <button id="resendBtn" class="text-blue-400 hover:underline ml-1">Resend</button>
        <p id="timer" class="text-xs mt-1"></p>
    </div>

    <!-- MESSAGE -->
    <p id="message" class="text-center text-red-400 mt-4 text-sm"></p>

</div>

<script>
const inputs = document.querySelectorAll(".otp-box");

// Auto move between inputs
inputs.forEach((input, index) => {
    input.classList.add(
        "w-12","h-12","text-center","text-lg",
        "rounded-lg","bg-white/20","border","border-white/30",
        "focus:outline-none","focus:ring-2","focus:ring-blue-400"
    );

    input.addEventListener("input", () => {
        if (input.value && index < inputs.length - 1) {
            inputs[index + 1].focus();
        }
    });

    input.addEventListener("keydown", (e) => {
        if (e.key === "Backspace" && !input.value && index > 0) {
            inputs[index - 1].focus();
        }
    });
});

// Combine OTP
function getOTP() {
    return Array.from(inputs).map(input => input.value).join("");
}

// Submit
document.getElementById("verifyForm").addEventListener("submit", async (e) => {
    e.preventDefault();

    const otp = getOTP();
    const email = localStorage.getItem("email");

    const verifyBtn = document.getElementById("verifyBtn");
    const loader = document.getElementById("loader");
    const message = document.getElementById("message");

    verifyBtn.disabled = true;
    loader.style.display = "inline-block";
    message.innerText = "";

    try {
        const response = await fetch("https://vx33eu1m54wsq5jmeedimetm.199.192.25.147.sslip.io/register/verify-email", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ email, otp })
        });

        const data = await response.json();

        if (response.ok) {
            window.location.href = "payment.html";
        } else {
            message.innerText = data.message;
        }

    } catch (error) {
        message.innerText = "Network error. Try again.";
    }

    verifyBtn.disabled = false;
    loader.style.display = "none";
});

// RESEND TIMER
let timeLeft = 30;
const timerEl = document.getElementById("timer");
const resendBtn = document.getElementById("resendBtn");

function startTimer() {
    resendBtn.disabled = true;

    const interval = setInterval(() => {
        timeLeft--;
        timerEl.innerText = `Resend in ${timeLeft}s`;

        if (timeLeft <= 0) {
            clearInterval(interval);
            timerEl.innerText = "";
            resendBtn.disabled = false;
            timeLeft = 30;
        }
    }, 1000);
}

startTimer();

// Resend OTP
resendBtn.addEventListener("click", async () => {
    const email = localStorage.getItem("email");

    await fetch("https://vx33eu1m54wsq5jmeedimetm.199.192.25.147.sslip.io/register/initiate", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email })
    });

    startTimer();
});
</script>

</body>
</html>
